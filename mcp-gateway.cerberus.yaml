# Folio Option B scaffold, manually completed for CW-20261115-0069.
# Preserve config.dir/env_file until Folio CW-20261115-0129 lands; see docs/runbook.md.
kind: cerberus-project/v1
owner: mcp-gateway
namespace: local
project:
  id: mcp-gateway
  name: "MCP Gateway"
resources:
  - id: mcp-gateway
    name: "MCP Gateway"
    type: process
    project: mcp-gateway
    connector: local
    config:
      command:
        - "~/.local/bin/mcp-gateway"
        - serve
        - --managed
        - --addr
        - 127.0.0.1:8080
      dir: "~/.config/mcp-gateway"
      env_file: "~/.config/mcp-gateway/service.env"
      mode: os_service
      # Credentials come from operator config or the app's own identity provider.
      # env_file, when set, is a reference to an owner-only file outside the repository.
      port: 8080
      run_from: workspace
      supervisor: auto
      url: http://127.0.0.1:8080/healthz
      health_check:
        url: http://127.0.0.1:8080/healthz
    tags:
      - api
      - go
      - daemon
      - mcp-gateway
